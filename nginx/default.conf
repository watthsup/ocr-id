# Connection upgrade mapping for WebSockets / HTTP 1.1
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream Backend Service (FastAPI)
upstream backend_service {
    server backend:8000;
    keepalive 32;
}

# Upstream Frontend Service (React SPA)
upstream frontend_service {
    server frontend:80;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Maximum upload size for Thai ID card images (e.g. high-res smartphone photos)
    client_max_body_size 25M;

    # Timeouts for OCR and LLM processing (large images / cold starts)
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # Gzip settings for fast response delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # -------------------------------------------------------------------------
    # 1. API Endpoints (Direct and sub-path prefixed)
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /demo/id-card/api/ {
        rewrite ^/demo/id-card/api/(.*)$ /api/$1 break;
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # 2. Health Check Endpoints
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend_service/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /demo/id-card/health {
        rewrite ^/demo/id-card/health$ /health break;
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # 3. Interactive API Documentation (Swagger & ReDoc)
    # -------------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # 4.1 Frontend Web Application at /demo/id-card/ (Thai ID Card)
    # -------------------------------------------------------------------------
    # Redirect /demo/id-card (missing trailing slash) to /demo/id-card/
    location = /demo/id-card {
        return 301 /demo/id-card/;
    }

    # Proxy /demo/id-card/ to frontend root
    location /demo/id-card/ {
        proxy_pass http://frontend_service/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # 4.2 Frontend Web Application at /demo/group-eb/ (Claims EB Project)
    # -------------------------------------------------------------------------
    # Redirect /demo/group-eb (missing trailing slash) to /demo/group-eb/
    location = /demo/group-eb {
        return 301 /demo/group-eb/;
    }

    # Proxy /demo/group-eb/ dynamically to claims_eb_frontend container on ocr-poc network
    location /demo/group-eb/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $claims_frontend http://claims_eb_frontend:80;
        proxy_pass $claims_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Claims Group EB API Proxy
    location /api/v1/claims/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $claims_backend http://claims_eb_backend:8000;
        proxy_pass $claims_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # 5. Gateway Landing Hub (Multi-App Portal at root /)
    # -------------------------------------------------------------------------
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenWings Application Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 22px; color: #fff; margin-bottom: 6px; }
    .header p { color: #94a3b8; font-size: 14px; }
    .app-list { display: flex; flex-direction: column; gap: 12px; }
    .app-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #38bdf8; text-decoration: none; font-weight: 500; transition: all 0.2s; }
    .app-item:hover { border-color: #38bdf8; background: #1e293b; transform: translateY(-1px); }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
    .badge-active { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #64748b; }
    .footer a { color: #a78bfa; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>🚀 GenWings Gateway</h1>
      <p>Select an application to access:</p>
    </div>
    <div class="app-list">
      <a href="/demo/id-card/" class="app-item">
        <span>🆔 Thai ID Card OCR &amp; KIE</span>
        <span class="badge badge-active">Active</span>
      </a>
      <a href="/demo/group-eb/" class="app-item">
        <span>📋 Group EB (Employee Benefits)</span>
        <span class="badge badge-active">Active</span>
      </a>
    </div>
    <div class="footer">
      <span>Shared Network: ocr-poc</span>
      <a href="/docs">Swagger API Docs →</a>
    </div>
  </div>
</body>
</html>';
    }
}

