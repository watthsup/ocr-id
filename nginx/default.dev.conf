# Connection upgrade mapping for WebSockets / HTTP 1.1 (Vite HMR support)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream Backend Service (FastAPI)
upstream backend_service {
    server backend:8000;
    keepalive 32;
}

# Upstream Frontend Dev Service (Vite Dev Server on 3000)
upstream frontend_service {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Maximum upload size for Thai ID card images
    client_max_body_size 25M;

    # Timeouts for OCR & LLM processing
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # 1. API Endpoints -> Backend (FastAPI)
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # 2. Health Check Endpoint -> Backend
    location /health {
        proxy_pass http://backend_service/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Interactive API Documentation (Swagger & ReDoc) -> Backend
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Frontend Web Application (with Vite HMR WebSockets)
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
