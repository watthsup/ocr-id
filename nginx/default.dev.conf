# Connection upgrade mapping for WebSockets / HTTP 1.1 (Vite HMR support)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream Backend Service (FastAPI)
upstream backend_service {
    server backend:8000;
    keepalive 32;
}

# Upstream Frontend Dev Service (Vite Dev Server on 3000)
upstream frontend_service {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Maximum upload size for Thai ID card images
    client_max_body_size 25M;

    # Timeouts for OCR & LLM processing
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # -------------------------------------------------------------------------
    # 1. API Endpoints
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /demo/id-card/api/ {
        rewrite ^/demo/id-card/api/(.*)$ /api/$1 break;
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # 2. Health Check Endpoints
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass http://backend_service/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /demo/id-card/health {
        rewrite ^/demo/id-card/health$ /health break;
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # 3. Interactive API Documentation (Swagger & ReDoc)
    # -------------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # 4. Frontend Web Application at /demo/id-card/ (with Vite HMR WebSockets)
    # -------------------------------------------------------------------------
    location = /demo/id-card {
        return 301 /demo/id-card/;
    }

    location /demo/id-card/ {
        proxy_pass http://frontend_service/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # 5. Default Root Redirect
    # -------------------------------------------------------------------------
    location = / {
        return 301 /demo/id-card/;
    }

    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
